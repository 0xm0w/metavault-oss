name: Windows installer

# Builds the MetaVault OSS NSIS installer on windows-latest and uploads the
# installer artifact alongside SHA256SUMS.
# No API keys are set, so nothing here calls the Meta API.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: App version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content packages/app/package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "App version: $v"

      - name: Build app and bundle vaultd
        working-directory: packages/app
        run: |
          npm run build
          npm run bundle

      # electron-builder is a locked root devDependency; --publish never so
      # this step cannot create or change a release.
      - name: Build NSIS installer
        working-directory: packages/app
        run: npx electron-builder --win --publish never

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $dir = "packages/app/release"
          $exe = Get-ChildItem $dir -Filter "*.exe" -File
          if (-not $exe) { throw "No installer in $dir" }
          $exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content (Join-Path $dir "SHA256SUMS") -Encoding ascii
          Get-Content (Join-Path $dir "SHA256SUMS")
          Get-ChildItem $dir -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: metavault-oss-windows-installer
          path: |
            packages/app/release/*.exe
            packages/app/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
