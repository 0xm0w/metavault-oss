name: Windows installer

# Builds the MetaVault OSS NSIS installer on windows-latest, then runs a
# clean-install smoke test: silent install, launch, poll /health, silent
# uninstall, check that files, shortcuts, registry and PATH entries are gone.
# On a v* tag or a manual run it also creates or refreshes a DRAFT GitHub
# release with the installer attached. It never publishes a release.
# No API keys are set, so nothing here calls the Meta API.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: App version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content packages/app/package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "App version: $v"

      - name: Build app and bundle vaultd
        working-directory: packages/app
        run: |
          npm run build
          npm run bundle

      # electron-builder is a locked root devDependency; --publish never so
      # this step cannot create or change a release.
      - name: Build NSIS installer
        working-directory: packages/app
        run: npx electron-builder --win --publish never

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $dir = "packages/app/release"
          $exe = Get-ChildItem $dir -Filter "*.exe" -File
          if (-not $exe) { throw "No installer in $dir" }
          $exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content (Join-Path $dir "SHA256SUMS") -Encoding ascii
          Get-Content (Join-Path $dir "SHA256SUMS")
          Get-ChildItem $dir -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: metavault-oss-windows-installer
          path: |
            packages/app/release/*.exe
            packages/app/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Clean-install smoke test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: metavault-oss-windows-installer
          path: installer

      - name: Install, launch, /health, uninstall
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1 -InstallerDir installer -LogPath "$env:RUNNER_TEMP/windows-installer-smoke.txt"

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-smoke-log
          path: ${{ runner.temp }}/windows-installer-smoke.txt
          if-no-files-found: warn

  draft-release:
    name: Draft release (never published)
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: metavault-oss-windows-installer
          path: installer

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          cat > notes.md <<NOTES
          MetaVault OSS ${tag} for Windows (x64). Alpha test build.

          - The installer is not code-signed, so Windows SmartScreen may warn.
          - No AI model is bundled or downloaded. Add a Meta API key to use Muse Spark, or point Settings at your own local endpoint (Ollama or OpenAI-compatible). With neither, every request comes to you.
          - Check the download against SHA256SUMS.

          Built from ${TARGET} by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.
          NOTES
          existing="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$existing" = "false" ]; then
            echo "::error::$tag is already published; this workflow only manages drafts."
            exit 1
          fi
          if [ "$existing" = "true" ]; then
            gh release upload "$tag" installer/*.exe installer/SHA256SUMS --clobber
            gh release edit "$tag" --draft --prerelease --notes-file notes.md
          else
            gh release create "$tag" installer/*.exe installer/SHA256SUMS \
              --draft --prerelease --target "$TARGET" --title "MetaVault OSS ${tag}" --notes-file notes.md
          fi
          gh release view "$tag" --json tagName,isDraft,isPrerelease,url,assets \
            --jq '{tagName,isDraft,isPrerelease,url,assets:[.assets[].name]}'
