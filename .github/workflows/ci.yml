name: CI

on:
  push:
    branches: [main]
  # Every PR runs checks, whatever its base branch (stacked PRs included).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    # Never run fork PRs: one leg is on a self-hosted runner. The matrix
    # context is not available in a job-level if, so this guards both legs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner: '"windows-latest"'
            hosted: true
          # Local Docker runner, see ops/ci-runner. The metavault-ci label keeps
          # other repos' runners from ever matching.
          - os: ubuntu-latest
            runner: '["self-hosted", "linux", "metavault-ci"]'
            hosted: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Real sshd for the tunnel integration test (positive + negative proof
      # of the generated authorized_keys line; skips when unavailable).
      - name: Install OpenSSH server (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.hosted
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # The real-sshd integration test skips itself when sshd is missing. Fail
      # instead of silently losing that coverage.
      - name: Require the sshd integration test to run (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx vitest run packages/app/test/ssh-tunnel-sshd.integration.test.ts --reporter=json --outputFile=sshd-it.json
          node -e "const r=require('./sshd-it.json'); if (r.numPassedTests < 1 || r.numPendingTests > 0 || r.numFailedTests > 0) { console.error('sshd integration test skipped or failed', r.numPassedTests, r.numPendingTests, r.numFailedTests); process.exit(1); }"

      - name: Coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage report (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ubuntu
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
