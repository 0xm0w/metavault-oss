name: CI

on:
  push:
    branches: [main]
  # Every PR runs checks, whatever its base branch (stacked PRs included).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    # The self-hosted Linux leg runs only for pushes and same-repo pull
    # requests, never for fork PRs.
    if: matrix.hosted || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner: '"windows-latest"'
            hosted: true
          # Local Docker runner, see ops/ci-runner. The metavault-ci label keeps
          # other repos' runners from ever matching.
          - os: ubuntu-latest
            runner: '["self-hosted", "linux", "metavault-ci"]'
            hosted: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Real sshd for the tunnel integration test (positive + negative proof
      # of the generated authorized_keys line; skips when unavailable).
      - name: Install OpenSSH server (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.hosted
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage report (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ubuntu
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
