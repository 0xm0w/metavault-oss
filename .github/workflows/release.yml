name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows prerelease
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build app
        working-directory: packages/app
        run: npm run build

      # electron-builder is a locked root devDependency (Task 11); npx
      # resolves the local binary from node_modules without a network fetch.
      - name: Build Windows NSIS installer
        working-directory: packages/app
        run: npx electron-builder --win --publish never

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $releaseDir = "packages/app/release"
          $installers = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File
          if (-not $installers) {
            throw "No NSIS installer (*.exe) found in $releaseDir"
          }
          $lines = foreach ($file in $installers) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path (Join-Path $releaseDir "SHA256SUMS") -Encoding ascii
          Get-Content (Join-Path $releaseDir "SHA256SUMS")

      - name: Verify release artifacts
        shell: pwsh
        run: |
          if (-not (Get-ChildItem -Path "packages/app/release" -Filter "*.exe" -File)) {
            throw "NSIS installer missing"
          }
          if (-not (Test-Path "packages/app/release/SHA256SUMS")) {
            throw "SHA256SUMS missing"
          }
          Get-ChildItem -Path "packages/app/release" -File | Select-Object Name, Length

      - name: Upload installer as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: openvault-windows-${{ github.ref_name }}
          path: |
            packages/app/release/*.exe
            packages/app/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            packages/app/release/*.exe
            packages/app/release/SHA256SUMS
