# MetaVault CI runner. Separate project, volumes, name and label from any other
# runner. No Docker socket, no privileged mode, no published ports.
name: metavault-ci
services:
  runner:
    build: .
    image: metavault-ci-runner:2.338.2
    container_name: metavault-ci-1
    restart: unless-stopped
    environment:
      RUNNER_REPO: 0xm0w/metavault-oss
      RUNNER_NAME: metavault-ci-1
    secrets:
      - runner_token
    volumes:
      - mv_state:/state
      - mv_work:/work
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 6g
    cpus: 4
volumes:
  mv_state:
  mv_work:
secrets:
  runner_token:
    file: ./runner-token.txt
