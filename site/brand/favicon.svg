<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Deep Void Squircle -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a" stroke="#212327" stroke-width="4"/>

  <!-- Subdued Safe Rim Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#16181b" stroke-width="10"/>

  <!-- Iconic 2-Arm Meta S-Curve Turn Key (Ultra-Minimalist) -->
  <!-- A single unbroken flowing curve pivoting around the center lock -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fluid Meta Spline Handle -->
    <path d="M 128 320 
             C 100 240 180 180 256 256 
             C 332 332 412 272 384 192" 
          stroke="#2dd4bf" stroke-width="40"/>
    
    <!-- Precision Inner High-Glow Core Line -->
    <path d="M 134 316 
             C 110 246 182 186 256 256 
             C 330 326 402 266 378 196" 
          stroke="#ffffff" stroke-width="8" opacity="0.6"/>

    <!-- Dual Solid Grip Ends (The Turn Handles) -->
    <circle cx="128" cy="320" r="28" fill="#0a0a0a" stroke="#2dd4bf" stroke-width="12"/>
    <circle cx="128" cy="320" r="8" fill="#5eead4"/>

    <circle cx="384" cy="192" r="28" fill="#0a0a0a" stroke="#2dd4bf" stroke-width="12"/>
    <circle cx="384" cy="192" r="8" fill="#5eead4"/>
  </g>

  <!-- Heavy Vault Center Lock Hub -->
  <circle cx="256" cy="256" r="48" fill="#141618" stroke="#212327" stroke-width="8"/>
  <circle cx="256" cy="256" r="22" fill="#0a0a0a" stroke="#2dd4bf" stroke-width="6"/>
  <circle cx="256" cy="256" r="6" fill="#5eead4"/>
</svg>
