<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Void Canvas -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a" stroke="#212327" stroke-width="4"/>

  <!-- Minimalist Vault Dial Circle (Base housing) -->
  <circle cx="256" cy="256" r="160" fill="#141618" stroke="#212327" stroke-width="8"/>
  
  <!-- Subtle Dial Calibration Marks -->
  <g stroke="#363a3f" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="104" x2="256" y2="116"/>
    <line x1="408" y1="256" x2="396" y2="256"/>
    <line x1="256" y1="408" x2="256" y2="396"/>
    <line x1="104" y1="256" x2="116" y2="256"/>
    <line x1="363" y1="149" x2="354" y2="158"/>
    <line x1="363" y1="363" x2="354" y2="354"/>
    <line x1="149" y1="363" x2="158" y2="354"/>
    <line x1="149" y1="149" x2="158" y2="158"/>
  </g>

  <!-- The Bold Minimalist Turn-Key: Continuous Meta-Curve Wing-Nut / T-Turn Handle -->
  <!-- A single continuous path that curves up on the left, crosses the center pivot, and curves down on the right -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Wing Wings: Meta continuous ribbon turned into an ergonomic safe handle -->
    <path d="M 120 220 
             C 120 170 170 170 200 210 
             C 225 245 235 256 256 256 
             C 277 256 287 245 312 210 
             C 342 170 392 170 392 220 
             C 392 270 342 270 312 230
             L 256 256
             L 200 230
             C 170 270 120 270 120 220 Z" 
          fill="#2dd4bf" stroke="#5eead4" stroke-width="4"/>

    <!-- High-Precision Center Rotor -->
    <circle cx="256" cy="256" r="32" fill="#0a0a0a" stroke="#212327" stroke-width="6"/>
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  </g>

  <!-- Rotation Arc / Dynamic Turn Accent -->
  <path d="M 200 84 C 236 74 276 74 312 84" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"/>
  <polygon points="320,87 312,74 308,94" fill="#2dd4bf"/>
</svg>
