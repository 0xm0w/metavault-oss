<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141618" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="tealGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4" />
      <stop offset="35%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="cleanGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad3)" stroke="#212327" stroke-width="6"/>

  <g filter="url(#cleanGlow3)">
    <!-- Primary Continuous Meta Ribbon: Smoothly drawn parametric-style curve -->
    <!-- Represents 'M' for Meta & 'V' for Vault, closing into an endless loop -->
    <path d="M 150 310
             C 110 270 100 200 150 160
             C 200 120 235 180 256 240
             C 277 180 312 120 362 160
             C 412 200 402 270 362 310
             C 320 350 280 330 256 270
             C 232 330 192 350 150 310 Z"
          fill="none" stroke="url(#tealGrad3)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Precision Inner Light Ribbon (Highlights top curvature) -->
  <path d="M 155 165 C 190 135 225 180 256 240 C 287 180 322 135 357 165" 
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4" />

  <!-- Center Security Node / Hardware Key Anchor -->
  <circle cx="256" cy="256" r="12" fill="#5eead4" />
</svg>
