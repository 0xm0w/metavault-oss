<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141618" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="metaTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="vaultGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#212327" stroke-width="6"/>

  <!-- Subtle Shield / Vault Outline in hairline gray -->
  <path d="M 256 70 Q 370 70 390 150 C 390 280 256 420 256 420 C 256 420 122 280 122 150 Q 142 70 256 70 Z" 
        fill="none" stroke="#212327" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Meta Curvy Loop Geometry (The Infinite Vault Ribbon) -->
  <g filter="url(#vaultGlow)">
    <!-- Back Loop Layer (Depth Shadow) -->
    <path d="M 175 256 C 115 190 120 140 170 140 C 225 140 256 256 256 256 C 256 256 287 372 342 372 C 392 372 397 322 337 256"
          fill="none" stroke="#134e4a" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

    <!-- Primary Continuous Meta-Ribbon -->
    <path d="M 170 150 C 120 150 115 200 175 266 L 337 146 C 397 212 392 262 342 262 C 287 262 256 368 256 368 C 256 368 225 262 170 150 Z"
          fill="none" stroke="url(#metaTeal)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Iconic Infinity Double-Loop Path (Meta Style smoothly intertwined) -->
    <path d="M 256 256 
             C 210 180 170 170 145 195 
             C 115 225 115 287 145 317 
             C 180 352 225 320 256 256
             C 287 192 332 160 367 195 
             C 397 225 397 287 367 317 
             C 342 342 302 332 256 256 Z" 
          fill="none" stroke="url(#metaTeal)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Central Micro-Keyhole / Core Shield Dot -->
  <circle cx="256" cy="256" r="14" fill="#0a0a0a" stroke="#5eead4" stroke-width="5" />
</svg>
