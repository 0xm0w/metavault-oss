<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141618" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="tealGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c20" />
      <stop offset="100%" stop-color="#0e1013" />
    </linearGradient>
    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)" stroke="#212327" stroke-width="6"/>

  <!-- Shield Crest Background -->
  <path d="M 256 90 
           C 340 90 380 120 380 200 
           C 380 320 256 410 256 410 
           C 256 410 132 320 132 200 
           C 132 120 172 90 256 90 Z" 
        fill="url(#shieldGrad)" stroke="#2a2e35" stroke-width="4" />

  <!-- The "M" Meta-Crest curves fused into the upper shield and lower lock -->
  <g filter="url(#softGlow2)">
    <!-- Left Loop of Meta 'M' -->
    <path d="M 256 260 
             C 215 175 160 165 170 235 
             C 178 290 220 310 256 345 
             C 292 310 334 290 342 235 
             C 352 165 297 175 256 260 Z" 
          fill="none" stroke="url(#tealGrad2)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Shackle / Arch over the top -->
    <path d="M 200 170 C 200 130 225 110 256 110 C 287 110 312 130 312 170" 
          fill="none" stroke="#dadbdf" stroke-width="20" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Center Vault Core Indicator -->
  <circle cx="256" cy="275" r="16" fill="#2dd4bf" />
  <rect x="251" y="275" width="10" height="28" rx="5" fill="#2dd4bf" />
</svg>
