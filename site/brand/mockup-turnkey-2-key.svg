<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Void Canvas -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a" stroke="#212327" stroke-width="4"/>

  <!-- Master Key Body: Angled dynamically at 45 degrees -->
  <g transform="translate(256 256) rotate(-45) translate(-256 -256)">
    
    <!-- Meta Infinity Bow / Handle of the Key (Curvy, seamless, minimalist) -->
    <!-- Two intertwining loops of the turn-key bow -->
    <path d="M 160 256 
             C 120 180 60 180 60 256 
             C 60 332 120 332 160 256
             C 200 180 260 180 260 256 
             C 260 332 200 332 160 256 Z" 
          fill="none" stroke="#2dd4bf" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Key Shaft (Extending from the right lobe of the Meta loop) -->
    <path d="M 260 256 L 430 256" stroke="#2dd4bf" stroke-width="28" stroke-linecap="round"/>

    <!-- Precision Minimalist Bit / Wards (Stylized Vault Locking Teeth) -->
    <!-- Bit 1: Primary downward tooth -->
    <path d="M 380 256 L 380 320" stroke="#2dd4bf" stroke-width="24" stroke-linecap="round"/>
    <!-- Bit 2: Secondary terminal tooth forming a modern stepped notch -->
    <path d="M 425 256 L 425 300" stroke="#2dd4bf" stroke-width="24" stroke-linecap="round"/>

    <!-- Keyhole / Core Accents in the Bow Loops -->
    <circle cx="110" cy="256" r="14" fill="#0a0a0a" stroke="#212327" stroke-width="5"/>
    <circle cx="210" cy="256" r="14" fill="#0a0a0a" stroke="#212327" stroke-width="5"/>
  </g>

  <!-- Dynamic Rotational Turn Indicator Arc (The "Turn" of the key) -->
  <path d="M 100 256 A 170 170 0 0 1 256 86" 
        fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 14" opacity="0.4"/>
  <polygon points="262,76 276,86 262,96" fill="#2dd4bf" opacity="0.6"/>
</svg>
