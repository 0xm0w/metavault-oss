<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Void Canvas -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a" stroke="#212327" stroke-width="4"/>

  <!-- Precision Bank Safe Door Seam -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#1f2228" stroke-width="12"/>

  <!-- The Minimalist Turn-Key Wheel: 
       A gorgeous 3-pronged curved wheel where each arm is a fluid Meta spline, 
       merging at a central pivot point -->
  <g fill="none" stroke="#2dd4bf" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arm 1: Curving Up-Right -->
    <path d="M 256 256 C 256 180 320 150 350 110" />
    <!-- Arm 2: Curving Down-Right -->
    <path d="M 256 256 C 310 280 370 330 350 390" />
    <!-- Arm 3: Curving Left -->
    <path d="M 256 256 C 180 280 130 220 110 260" />
  </g>

  <!-- Spherical Ergonomic Grips at the tips of the 3 turn-arms -->
  <circle cx="350" cy="110" r="24" fill="#5eead4" stroke="#0a0a0a" stroke-width="6"/>
  <circle cx="350" cy="390" r="24" fill="#5eead4" stroke="#0a0a0a" stroke-width="6"/>
  <circle cx="110" cy="260" r="24" fill="#5eead4" stroke="#0a0a0a" stroke-width="6"/>

  <!-- Heavy Center Rotor & Keyhole Core -->
  <circle cx="256" cy="256" r="44" fill="#141618" stroke="#212327" stroke-width="8"/>
  <circle cx="256" cy="256" r="20" fill="#0a0a0a" stroke="#2dd4bf" stroke-width="8"/>
  <path d="M 256 264 L 256 280" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"/>
</svg>
