<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: https:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaVault OSS</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 64 64" fill="none" style="vertical-align: -3px; margin-right: 8px;">
      <rect width="64" height="64" rx="14" fill="#0a0a0a" stroke="#212327" stroke-width="2"/>
      <circle cx="32" cy="32" r="21" stroke="#16181b" stroke-width="3"/>
      <!-- S-curve Turn-Key handle -->
      <path d="M 16 40 C 12 30 22 22 32 32 C 42 42 52 34 48 24" stroke="#2dd4bf" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="16" cy="40" r="3.5" fill="#5eead4"/>
      <circle cx="48" cy="24" r="3.5" fill="#5eead4"/>
      <!-- Rotor Hub -->
      <circle cx="32" cy="32" r="5" fill="#141618" stroke="#2dd4bf" stroke-width="1.5"/>
    </svg>
    METAVAULT OSS
  </div>
  <div class="header-right">
    <span id="marshal-line" class="marshal-line">Marshal · Llama 3.2 3B · On-device</span>
    <span id="daemon-status" class="daemon-status" title="vaultd connection">● connecting</span>
  </div>
</header>
<nav class="app-nav" aria-label="Views">
  <button type="button" data-view="approval" class="nav-btn is-active">Approval</button>
  <button type="button" data-view="vault" class="nav-btn">Vault</button>
  <button type="button" data-view="audit" class="nav-btn">Audit</button>
  <button type="button" data-view="policies" class="nav-btn">Policies</button>
  <button type="button" data-view="settings" class="nav-btn">Settings</button>
</nav>
<div id="banner" class="banner" hidden></div>
<main id="view" class="view"></main>
<footer class="app-footer">Agents never see your secrets. vaultd holds the keys; this window only approves.</footer>
<script type="module" src="./main.js"></script>
</body>
</html>
